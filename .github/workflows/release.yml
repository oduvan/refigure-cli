name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.1.0'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Nothing is built for a release until the suite passes. A release once went
  # out with a feature missing and its own tests failing, because the release
  # workflow never ran them and the CI failure went unread.
  test:
    name: test before releasing
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Every target is cross-compiled from one machine, so the six binaries
      # differ only in GOOS/GOARCH and not in the toolchain that made them.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          name="refigure"
          [ "$GOOS" = "windows" ] && name="refigure.exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" -o "dist/$name" ./cmd/refigure

          # Prove the file really is for the target before anyone downloads it.
          # `go version -m` reads the build info stamped into the binary.
          info=$(go version -m "dist/$name")
          echo "$info" | grep -q "GOOS=$GOOS" || { echo "::error::built binary is not $GOOS"; echo "$info"; exit 1; }
          echo "$info" | grep -q "GOARCH=$GOARCH" || { echo "::error::built binary is not $GOARCH"; echo "$info"; exit 1; }
          echo "$info" | grep -q "CGO_ENABLED=0" || { echo "::error::built binary is not static"; echo "$info"; exit 1; }

          base="refigure_${VERSION}_${GOOS}_${GOARCH}"
          cp README.md LICENSE dist/
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -q "../$base.zip" "$name" README.md LICENSE
          else
            tar -czf "../$base.tar.gz" "$name" README.md LICENSE
          fi

          # The archive is for people. The bare binary is for the desktop app,
          # which downloads one file, checks its hash and runs it — no unpacker
          # in an Electron main process.
          suffix=""
          [ "$GOOS" = "windows" ] && suffix=".exe"
          cp "$name" "../${base}${suffix}"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: refigure_*
          if-no-files-found: error

  # Nothing is published until every binary has exported a real image on the
  # operating system and architecture it was built for. Cross-compiling is not
  # evidence that a binary runs.
  verify:
    name: verify ${{ matrix.goos }}-${{ matrix.goarch }} on ${{ matrix.runner }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: amd64, runner: macos-latest }
          - { goos: darwin,  goarch: arm64, runner: macos-latest }
          - { goos: linux,   goarch: amd64, runner: ubuntu-latest }
          - { goos: linux,   goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: windows, goarch: amd64, runner: windows-latest }
          - { goos: windows, goarch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Unpack
        shell: bash
        run: |
          # Only the executable. The archives also carry README.md and LICENSE,
          # which are already here from the checkout — extracting those either
          # clobbers them or, on Windows, stops to ask.
          if [ "${{ matrix.goos }}" = "windows" ]; then
            unzip -q -o refigure_*.zip refigure.exe
          else
            tar -xzf refigure_*.tar.gz refigure
            chmod +x refigure
          fi

      # The smoke test is a real export of testdata/smoke: it decodes a PNG,
      # draws figures, resamples, and encodes PNG and WebP. If a target is
      # broken — a bad architecture, a WASM runtime that will not start — this
      # is where it shows, before the release exists.
      # The Intel macOS runners are scarce enough to hold a release up for half
      # an hour, so the amd64 binary is checked on the arm64 runner through
      # Rosetta. If Rosetta is not there the step fails loudly rather than
      # quietly proving nothing.
      - name: Check Rosetta is available
        if: matrix.goos == 'darwin' && matrix.goarch == 'amd64'
        run: |
          arch -x86_64 /usr/bin/true || {
            echo "::error::this runner cannot execute x86_64 binaries"
            exit 1
          }

      - name: Export on the target platform
        shell: bash
        run: |
          bin=./refigure
          [ "${{ matrix.goos }}" = "windows" ] && bin=./refigure.exe

          reported=$("$bin" version)
          [ "$reported" = "$VERSION" ] || { echo "::error::binary reports $reported, expected $VERSION"; exit 1; }

          # An --out that is not absolute resolves against the project folder,
          # not the working directory, so these are absolute on purpose. On
          # Windows that means a real Windows path: the binary is native, and
          # does not read Git Bash's /d/a/... as absolute.
          if [ "${{ matrix.goos }}" = "windows" ]; then
            out="$(pwd -W)/smoke"
          else
            out="$PWD/smoke"
          fi
          "$bin" validate testdata/smoke
          "$bin" export testdata/smoke --out "$out-png"
          "$bin" export testdata/smoke --out "$out-webp" --format webp --quality 50
          "$bin" export testdata/smoke --out "$out-small" --scale 160

          for file in "$out-png/hero.png" "$out-png/title.png" "$out-webp/hero.webp" "$out-small/hero.png"; do
            [ -s "$file" ] || { echo "::error::$file was not written"; exit 1; }
          done

          # --scale must have actually resampled, not just copied.
          full=$(wc -c < "$out-png/hero.png")
          small=$(wc -c < "$out-small/hero.png")
          [ "$small" -lt "$full" ] || { echo "::error::--scale 160 produced $small bytes against $full unscaled"; exit 1; }

          echo "exported on ${{ matrix.runner }}: $(ls "$out-png" "$out-webp" "$out-small" | tr '\n' ' ')"

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The desktop app downloads these and refuses to run one whose hash does
      # not match, so checksums.txt is part of the product, not a courtesy.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum refigure_* > checksums.txt
          cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag \
            artifacts/refigure_* artifacts/checksums.txt

  # The formula lives in this repo rather than a separate homebrew-tap, so the
  # release can update it with the token it already has. `brew tap` takes a URL,
  # so a tap does not have to be named homebrew-something.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Write the formula
        run: |
          curl -sSLo /tmp/checksums.txt \
            "https://github.com/${{ github.repository }}/releases/download/$VERSION/checksums.txt"
          scripts/brew-formula.sh "$VERSION" /tmp/checksums.txt

      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/refigure.rb; then
            echo "the formula was already current"
            exit 0
          fi
          git add Formula/refigure.rb
          git commit -m "Point the Homebrew formula at $VERSION"
          git push origin main

  # Publishing needs an NPM_TOKEN secret. Without one this reports and stops:
  # a missing token is a setup step nobody has done yet, not a broken release.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm --provenance signs the publish with a workflow identity.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build the packages
        run: scripts/npm-packages.sh "$VERSION" artifacts

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is not set, so nothing was published to npm."
            exit 0
          fi
          # The platform packages first: the wrapper depends on them, and a
          # wrapper on the registry whose binaries are not there yet installs
          # into a broken state.
          for package in npm/dist/refigure-cli-*; do
            npm publish "$package" --access public --provenance
          done
          npm publish npm/dist/refigure-cli --access public --provenance
