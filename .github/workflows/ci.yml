name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # The renderer is the whole product, and it can differ between platforms —
    # font resolution and rasterisation are not identical everywhere. So the
    # tests run on all three rather than on Linux alone.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      # -count=1: the command tests build the binary in TestMain, which the
      # test cache cannot see, so a cached pass would be meaningless.
      - run: go test -race -count=1 ./...

  build:
    name: build all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      # Proves every release target still cross-compiles, on every push,
      # rather than finding out when a tag is cut.
      - run: make build-all
